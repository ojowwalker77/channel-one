# Builds kiwi for every platform from a tagged commit, on GitHub's machines,
# and publishes the files with checksums and a signed build-provenance
# attestation, so anyone can check a binary came from this exact source:
#   gh attestation verify ~/.kiwi/bin/kiwi --repo ojowwalker77/channel-one
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the version matches the tag
        run: |
          v=$(bun -e 'console.log((await import("./src/version.ts")).VERSION)')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "src/version.ts says $v, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Test
        run: bun test

      - name: Build
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            bun build src/cli/main.ts --compile --minify --target="bun-$t" --outfile "dist/kiwi-$t$ext"
          done
          # Apple Silicon only runs signed code: give the macOS builds an ad-hoc signature.
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version
          (cd dist && shasum -a 256 kiwi-* > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/kiwi-*"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "kiwi $GITHUB_REF_NAME" \
            --notes "Install: curl -fsSL https://channel-one.modelchannel.workers.dev/install | sh (macOS, Linux) or irm https://channel-one.modelchannel.workers.dev/install.ps1 | iex (Windows). Every file is checksummed in SHA256SUMS and has a build-provenance attestation: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
